name: توليد مقالة SEO احترافية

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '🔑 الكلمة المفتاحية (مثال: أفضل طرق تعلم البرمجة)'
        required: true
        type: string
      language:
        description: '🌐 اللغة (مثال: Arabic, English, French)'
        required: false
        default: 'Arabic'
        type: string

jobs:
  generate-seo-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # إنشاء فرع وPull Request للمراجعة

    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 تثبيت المكتبات المطلوبة
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: seoagent-export/seo-agent-pro

      - name: 🤖 تشغيل وكيل SEO
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INPUT_KEYWORD: ${{ github.event.inputs.keyword }}
          INPUT_LANGUAGE: ${{ github.event.inputs.language }}
        run: |
          python seo_agent.py
        working-directory: seoagent-export/seo-agent-pro

      - name: 📤 فتح Pull Request للمخرجات الجديدة
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "content: add generated SEO article"
          title: "content: add generated SEO article"
          body: "تم توليد المحتوى آليًا. يرجى مراجعة الملفات قبل الدمج في المصدر الرسمي للمقالات."
          branch: "automation/generated-seo-article"
          delete-branch: true
          add-paths: |
            seoagent-export/seo-agent-pro/outputs/**
            seoagent-export/seo-agent-pro/memory/**
