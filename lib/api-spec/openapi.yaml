openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AIPrintVerse API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user roles
  - name: designs
    description: Design management
  - name: blog
    description: Blog posts and categories
  - name: stores
    description: Store management
  - name: analytics
    description: Page views and link tracking
  - name: seo
    description: SEO tools - article templates and generation
  - name: ebooks
    description: Ebook and PDF book management
  - name: ai
    description: AI-powered features

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info and admin status
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"

  /auth/signin:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials

  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Sign up with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"

  /auth/signout:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out

  /auth/roles:
    get:
      operationId: getUserRoles
      tags: [auth]
      summary: List user roles (admin only)
      responses:
        "200":
          description: List of user roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRole"
    post:
      operationId: assignRole
      tags: [auth]
      summary: Assign role to user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRole"

  # Designs
  /designs:
    get:
      operationId: listDesigns
      tags: [designs]
      summary: List designs with optional category filter
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of designs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignListResponse"
    post:
      operationId: createDesign
      tags: [designs]
      summary: Create a design (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"

  /designs/{id}:
    get:
      operationId: getDesign
      tags: [designs]
      summary: Get design by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Design
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
        "404":
          description: Not found
    patch:
      operationId: updateDesign
      tags: [designs]
      summary: Update design (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
    delete:
      operationId: deleteDesign
      tags: [designs]
      summary: Delete design (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /designs/categories:
    get:
      operationId: listDesignCategories
      tags: [designs]
      summary: List all unique design categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /designs/stats:
    get:
      operationId: getDesignStats
      tags: [designs]
      summary: Get design stats summary
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignStats"

  # Blog
  /blog/posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated blog posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostListResponse"
    post:
      operationId: createBlogPost
      tags: [blog]
      summary: Create blog post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  /blog/posts/{id}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get blog post by ID or slug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
    patch:
      operationId: updateBlogPost
      tags: [blog]
      summary: Update blog post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
    delete:
      operationId: deleteBlogPost
      tags: [blog]
      summary: Delete blog post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /blog/posts/slug/{slug}:
    get:
      operationId: getBlogPostBySlug
      tags: [blog]
      summary: Get published blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found

  /blog/categories:
    get:
      operationId: listBlogCategories
      tags: [blog]
      summary: List blog categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogCategory"
    post:
      operationId: createBlogCategory
      tags: [blog]
      summary: Create blog category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogCategory"

  /blog/stats:
    get:
      operationId: getBlogStats
      tags: [blog]
      summary: Blog stats overview
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogStats"

  # Stores
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List stores (admin only)
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create store (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{id}:
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete store (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Analytics
  /analytics/pageview:
    post:
      operationId: trackPageView
      tags: [analytics]
      summary: Track a page view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViewInput"
      responses:
        "201":
          description: Tracked

  /analytics/link-click:
    post:
      operationId: trackLinkClick
      tags: [analytics]
      summary: Track a link click
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkClickInput"
      responses:
        "200":
          description: Tracked

  /analytics/stats:
    get:
      operationId: getAnalyticsStats
      tags: [analytics]
      summary: Get analytics overview (admin only)
      responses:
        "200":
          description: Analytics stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsStats"

  /analytics/link-tracking:
    get:
      operationId: getLinkTracking
      tags: [analytics]
      summary: Get link tracking data (admin only)
      responses:
        "200":
          description: Link tracking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkTracking"

  # Auto-linking keywords
  /seo/auto-link-keywords:
    get:
      operationId: listAutoLinkKeywords
      tags: [seo]
      summary: List auto-link keywords
      responses:
        "200":
          description: Keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoLinkKeyword"
    post:
      operationId: createAutoLinkKeyword
      tags: [seo]
      summary: Create auto-link keyword (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoLinkKeywordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoLinkKeyword"

  /seo/auto-link-keywords/{id}:
    delete:
      operationId: deleteAutoLinkKeyword
      tags: [seo]
      summary: Delete auto-link keyword (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /seo/article-templates:
    get:
      operationId: listArticleTemplates
      tags: [seo]
      summary: List article templates (admin only)
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleTemplate"
    post:
      operationId: createArticleTemplate
      tags: [seo]
      summary: Create article template (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleTemplate"

  /seo/generation-batches:
    get:
      operationId: listGenerationBatches
      tags: [seo]
      summary: List generation batches (admin only)
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenerationBatch"
    post:
      operationId: createGenerationBatch
      tags: [seo]
      summary: Create generation batch (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationBatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationBatch"

  # AI features
  /ai/generate-article:
    post:
      operationId: generateArticle
      tags: [ai]
      summary: Generate article with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateArticleInput"
      responses:
        "200":
          description: Generated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedArticle"

  /ai/optimize-title:
    post:
      operationId: optimizeTitle
      tags: [ai]
      summary: Optimize article title for CTR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeTitleInput"
      responses:
        "200":
          description: Optimized titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizedTitles"

  /ai/internal-linking:
    post:
      operationId: aiInternalLinking
      tags: [ai]
      summary: AI-powered internal linking suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalLinkingInput"
      responses:
        "200":
          description: Linking suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalLinkingSuggestions"

  /ai/seo-analytics:
    post:
      operationId: seoAnalytics
      tags: [ai]
      summary: Run SEO analytics on content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SEOAnalyticsInput"
      responses:
        "200":
          description: SEO analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SEOAnalyticsResult"

  /ai/serp-analysis:
    post:
      operationId: serpAnalysis
      tags: [ai]
      summary: Analyze SERP for a keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SERPAnalysisInput"
      responses:
        "200":
          description: SERP analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SERPAnalysisResult"

  /ai/search-images:
    post:
      operationId: searchImages
      tags: [ai]
      summary: Search Unsplash for images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageSearchInput"
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSearchResult"

  /ai/import-designs:
    post:
      operationId: importDesigns
      tags: [ai]
      summary: Import designs from TeePublic/Redbubble
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportDesignsInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /ai/publish-scheduled:
    post:
      operationId: publishScheduledPosts
      tags: [ai]
      summary: Publish all scheduled posts that are due
      responses:
        "200":
          description: Published posts count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"

  # Ebooks
  /ebooks:
    get:
      operationId: listEbooks
      tags: [ebooks]
      summary: List ebooks
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ebooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ebook"
    post:
      operationId: createEbook
      tags: [ebooks]
      summary: Create a new ebook (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbookInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ebook"

  /ebooks/{id}:
    get:
      operationId: getEbook
      tags: [ebooks]
      summary: Get ebook by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbookWithChapters"
        "404":
          description: Not found
    patch:
      operationId: updateEbook
      tags: [ebooks]
      summary: Update ebook (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbookUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ebook"
    delete:
      operationId: deleteEbook
      tags: [ebooks]
      summary: Delete ebook (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /ebooks/{id}/chapters:
    get:
      operationId: listEbookChapters
      tags: [ebooks]
      summary: List chapters for an ebook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EbookChapter"
    post:
      operationId: addEbookChapter
      tags: [ebooks]
      summary: Add chapter to ebook (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbookChapterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbookChapter"

  /ebooks/{id}/generate-from-posts:
    post:
      operationId: generateEbookFromPosts
      tags: [ebooks]
      summary: Auto-generate ebook chapters from blog posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbookFromPostsInput"
      responses:
        "200":
          description: Generated chapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbookWithChapters"

  /ebooks/{id}/export-pdf:
    post:
      operationId: exportEbookPdf
      tags: [ebooks]
      summary: Export ebook as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbookExportResult"

  /sitemap:
    get:
      operationId: getSitemap
      tags: [blog]
      summary: Get sitemap data
      responses:
        "200":
          description: Sitemap entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Auth
    UserInfo:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        isAdmin:
          type: boolean
      required: [id, isAdmin]

    SignInInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    SignUpInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthSession:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"
      required: [token, user]

    UserRole:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        role:
          type: string
        created_at:
          type: string
      required: [id, user_id, role, created_at]

    UserRoleInput:
      type: object
      properties:
        user_id:
          type: string
        role:
          type: string
      required: [user_id, role]

    # Designs
    Design:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        teepublic_url:
          type: ["string", "null"]
        redbubble_url:
          type: ["string", "null"]
        amazon_url:
          type: ["string", "null"]
        etsy_url:
          type: ["string", "null"]
        featured:
          type: boolean
        source:
          type: ["string", "null"]
        external_id:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, name, image_url, category, featured]

    DesignInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        teepublic_url:
          type: string
        redbubble_url:
          type: string
        amazon_url:
          type: string
        etsy_url:
          type: string
        featured:
          type: boolean
        source:
          type: string
        external_id:
          type: string
      required: [name, image_url]

    DesignUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
